    <meta name="description" content="저의 기술을 보여드리죠" />

    <meta property="og:title" content="AA 포트폴리오 웹사이트"/>

    <meta property="og:url" content="https://yeunyeuna.github.io/260518_ex/og_preview.png"/>
    <meta property="og:image" content=""/>

    <!-- 페비콘 -->
    <link
      rel="icon"
      type="image/png"
      href="./favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./apple-touch-icon.png"
    />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- 웹폰트 -->
    <style>
      @font-face {
        font-family: "Pretendard";

          format("woff2");
        font-weight: 100;
        font-display: swap;
      }

      @font-face {
        font-family: "Pretendard";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-ExtraLight.woff2")
          format("woff2");
        font-weight: 200;
        font-display: swap;
      }

      @font-face {
        font-family: "Pretendard";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Light.woff2")
          format("woff2");
        font-weight: 300;
        font-display: swap;
      }

      @font-face {
        font-family: "Pretendard";

      /* 테그 전체에 적용 */
      /* body 또는  html에다가 폰트를 저장하면 '상속' */
      body {
        font-family: "Pretendard";
      }

      /* 모든 태그를 지정하는 *로 지정 */

      * {
        font-family: "Pretendard";
      }

      h1 {
        font-family: "SongamLeeHyeongSik";
      }

      span {
        font-family: "SongamLeeHyeongSik";

  <body>
    <!-- 폰트의 경우에 3가지 정도까지 괜찮음 -->
    <!-- 제목폰트 : 굴고 진지한 -->
    <h1>저는 AA입니다</h1>
    <!--본문 / 내용 폰트 : 알아보기 쉽고 가벼운 -->
    <p>희망적이고 의미있는 멘트를 해봅시다</p>
    <!-- 강조/악센트 폰트 : 약간 다른 느낌애 -->
    <p>여기를<span>강조</span>하자</p>
