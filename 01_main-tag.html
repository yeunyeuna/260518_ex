<!DOCTYPE html>
< lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인테그</title>
</head>
    <body>
    <!-- 제목, 헤드라인, h1 -->
    <h1>헤드라인1</h1>
    <!-- 각장 큰 것 -->
    <h2>헤드라인2</h2>
    <hr/>
    <p>가로 구분선 (hr)</p>
    <h3>헤드라인3</h3>
    <hr/>
    <p>가로 구분선 (hr)</p>
    <!-- shift 방향킬 범위 지정, alt 방향키로 지정한 범위를 이동, alt+shift로 지정한 범위를 복사 -->
    
    <a>링크</a>
    <a href="https://google.com" target="_blank"></a>
    <img src="https://picsum.photos/400/200" alt="랜덤이미지">

    <img src="주소인척" alt="깨진이미지">
    
    </body>
</html>
